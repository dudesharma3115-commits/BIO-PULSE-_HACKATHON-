<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChargeShare | Community EV Charging</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--line:#243056;--tx:#eef2ff;--mut:#8b95b7;--ac:#7c5cff;--ac2:#22d3ee;--g:#22c55e;--y:#facc15;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5ff;--card:#fff;--line:#dde2f5;--tx:#141a33;--mut:#5d6788;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#root{max-width:480px;margin:auto;min-height:100%;position:relative}
.scr{padding:20px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h2{font-size:24px;margin-bottom:4px}.mut{color:var(--mut);font-size:13px}
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:radial-gradient(circle at 50% 38%,#2a1f6e55,transparent 60%)}
.bolt{width:130px;filter:drop-shadow(0 0 18px var(--ac))}
.ring{fill:none;stroke:var(--ac2);stroke-width:2;stroke-dasharray:280;stroke-dashoffset:280;animation:dr 1.4s .1s forwards}
.bl{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:260;stroke-dashoffset:260;animation:dr 1.2s .6s forwards,fl .8s 1.7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:var(--y)}}
.intro h1{font-size:40px;margin-top:14px;opacity:0;animation:in .7s 1.3s forwards}.intro h1 span{color:var(--ac2)}
.intro p{color:var(--mut);margin-top:6px;opacity:0;animation:in .7s 1.7s forwards}
.bar{width:150px;height:4px;background:var(--line);border-radius:4px;margin-top:30px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:fw 2.8s linear forwards}
@keyframes fw{to{width:100%}}
.role{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;color:var(--tx);cursor:pointer;transition:.2s}
.role:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px #7c5cff33}
.role b{display:block;font-size:18px;margin:6px 0 2px}.role .e{font-size:30px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px;font-size:15px;outline:none}
input:focus{border-color:var(--ac)}input.bad{border-color:var(--r)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 14px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac)}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:16px;margin-top:22px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx);margin-top:10px}
.err{color:var(--r);font-size:12px;margin-top:4px;min-height:14px}
.vstep{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.sp{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ac2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;display:grid;place-items:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.pill{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--tx);cursor:pointer}
.map{margin:0 12px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.map svg{display:block;width:100%}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut);margin:10px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 20px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s;border-left:5px solid}
.card:hover{transform:translateX(3px)}
.card.g{border-left-color:var(--g)}.card.y{border-left-color:var(--y)}.card.r{border-left-color:var(--r);opacity:.7}
.card .m{flex:1}.card b{display:block}.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#111}
.tag.g{background:var(--g)}.tag.y{background:var(--y)}.tag.r{background:var(--r);color:#fff}
.price{text-align:right;font-weight:800;font-size:17px}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.ban{padding:12px;border-radius:12px;font-size:13px;margin:12px 0;color:#111;font-weight:600}.ban.g{background:var(--g)}.ban.y{background:var(--y)}.ban.r{background:var(--r);color:#fff}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.row.t{font-weight:800;font-size:18px;border:0}.row.s{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.stat{display:flex;gap:10px}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}
.pulse{animation:pl 1.8s infinite;transform-origin:center;transform-box:fill-box}@keyframes pl{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.big{text-align:center;padding:20px 0}.big .ok{width:64px;height:64px;font-size:32px;margin:0 auto 12px;animation:pop .5s}
@keyframes pop{from{transform:scale(0)}}
.otp{font-size:34px;letter-spacing:.3em;font-weight:800;color:var(--ac2)}
input[type=range]{padding:0;accent-color:var(--ac)}
.sw{width:50px;height:28px;border-radius:20px;background:var(--line);position:relative;cursor:pointer}.sw.on{background:var(--g)}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on i{left:25px}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);margin-right:8px;box-shadow:0 0 0 0 var(--g);animation:gp 1.6s infinite}@keyframes gp{70%{box-shadow:0 0 0 10px transparent}}
.app{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.lg{display:flex;align-items:center;gap:8px;font-size:17px}.lg span{color:var(--ac2)}
.rolechip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.tb button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px}.tb button span{font-size:19px}.tb button.on{color:var(--ac2);font-weight:700}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:22px;padding:22px;color:#fff;margin-top:10px;box-shadow:0 14px 34px #7c5cff44}.hero span{font-size:13px;opacity:.85}.hero b{display:block;font-size:38px;margin:2px 0}.hero small{opacity:.85}
.avatar{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:32px;font-weight:700;color:#fff;margin:16px auto 8px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:30px;font-size:14px;z-index:20;animation:in .3s}
.pmg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pm{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.pm i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:15px}.pm.on{border-color:var(--ac2);box-shadow:0 0 0 2px var(--ac2) inset}

:root{--bg:#070b16;--card:#10182b;--line:#24334d;--tx:#f3f7ff;--mut:#9aa9c3;--ac:#8b5cf6;--ac2:#31e6d0;--g:#38e08f;--y:#ffd166;--r:#ff647c;color-scheme:dark}

.map{background:#101a2b;border:1px solid #30415e;border-radius:24px;box-shadow:0 20px 60px #0003;margin:8px 20px}.map svg{min-height:250px}

.rolechip{background:linear-gradient(100deg,#7958f6,#21bdb6);box-shadow:0 4px 16px #7958f633}.tb{max-width:680px;bottom:18px;border:1px solid #30415b;border-radius:22px;background:#0c1425ed;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 16px 60px #0008;backdrop-filter:blur(20px)}.tb button{font-size:12px;padding:7px}.tb button span{font-size:21px}.tb button.on{color:#31e6d0}

/* CHARGESHARE — BOLD LANDING PAGE REDESIGN */
:root{--bg:#070b14;--card:#101a2a;--line:#26364a;--tx:#f4f8ff;--mut:#9aabc0;--ac:#8b6cff;--ac2:#46ead3;color-scheme:dark}
body{background:#070b14!important;color:#f4f8ff;}
#root{max-width:none!important;min-height:100vh!important;padding:0!important;}
.landing{position:relative;min-height:100vh;overflow:hidden;padding:28px clamp(22px,6vw,100px) 22px;background:radial-gradient(ellipse at 76% 43%,#193a473b 0,transparent 30%),radial-gradient(ellipse at 95% 5%,#5941a42c 0,transparent 34%),#070b14;isolation:isolate}

.landing-nav{display:flex;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto;border-bottom:1px solid #ffffff15;padding-bottom:23px}

const $=s=>document.querySelector(s),R=document.getElementById("root");
const S={role:null,p:{driver:null,host:null},kwh:15,rate:10,tab:"find",bA:[],adm:null,admSub:0,pos:null,geo:"idle",gmsg:"",demo:false,ch:[],bD:[],bH:[],bL:[],scr:"",on:true,pend:null,sel:null};
let U=null,DBH=null,WID=null,CC="CCS2";
const CONN=["CCS2","Type 2","CHAdeMO","3-Pin"];
const ST=new Set("AN AP AR AS BR CG CH DD DL DN GA GJ HP HR JH JK KA KL LA LD MH ML MN MP MZ NL OD PB PY RJ SK TN TR TS UK UP WB".split(" "));
const DEMO=[[.35,40,"CCS2",22,14,"Demo Villa"],[.8,110,"Type 2",7.4,11,"Demo Garage"],[1.2,200,"CHAdeMO",25,16,"Demo Apartment"],[1.9,290,"3-Pin",3.3,9,"Demo Home"],[2.6,350,"CCS2",30,18,"Demo Flat"]];
function go(h,s){S.scr=s||"";R.innerHTML=h;window.scrollTo(0,0)}
/* ---------- live geolocation ---------- */
function startGeo(){
 if(!navigator.geolocation){S.geo="err";S.gmsg="This browser has no location support.";return live()}
 if(WID!=null)navigator.geolocation.clearWatch(WID);
 S.geo="wait";live();
 WID=navigator.geolocation.watchPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};S.geo="ok";live()},
 e=>{S.geo="err";S.gmsg=e.code===1?"Location permission is blocked. Allow location for this page in your browser or site settings, then retry.":"Couldn’t get a GPS fix ("+e.message+"). Try near a window or outdoors, then retry.";live()},
 {enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
function gchip(){const g=S.geo,p=S.pos;
 if(g==="ok")return`<span class="gdot"></span><b>Live location</b> · ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} · ±${p.acc} m<br><a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" style="color:var(--ac2)">Open my location in Google Maps ↗</a>`;
 if(g==="err")return`<span style="color:var(--r)">📍 ${S.gmsg}</span><br><button class="pill" onclick="startGeo()">Retry location</button>`;
 return`<div class="sp" style="display:inline-block;vertical-align:middle;width:16px;height:16px"></div> Detecting your live location…`}
function live(){const g=$("#gc");if(g)g.innerHTML=gchip();const m=$("#csLocationMetric");if(m)m.textContent=S.geo==="ok"?"GPS connected":S.geo==="err"?"Location unavailable":"Detecting location…";if(S.scr==="drv"&&!$(".sheet"))paintDrv()}
const rad=x=>x*Math.PI/180;
function hav(a,b){const dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),x=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function brg(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return Math.atan2(y,x)}
/* ---------- compat + fare ---------- */
function compat(car,c){
 if(car===c.conn)return{l:"g",t:"Perfect match — plug straight in",kw:c.kw};
 if(car==="CCS2"&&c.conn==="Type 2")return{l:"y",t:"AC only — works, but slower charging",kw:Math.min(c.kw,7.4)};
 if(c.conn==="3-Pin")return{l:"y",t:"Emergency trickle charge via portable cable",kw:3.3};
 return{l:"r",t:"Different connector — cannot charge this vehicle",kw:0}}
function fare(c,k){const e=Math.round(k*c.rate),f=25,t=e+f,m=Math.round(t*.1);return{e,f,t,c:m,p:t-m}}
/* ---------- screens ---------- */
function intro(){go(`<section class="landing">
 <div class="landing-nav"><div class="brandmark"><span class="brandbolt">ϟ</span><span>Charge<span class="brand-accent">Share</span></span></div><span class="live-pill"><i></i> COMMUNITY POWER NETWORK</span></div>
 <div class="landing-grid"><div class="landing-copy"><div class="eyebrow"><span>✦</span> THE FUTURE OF EV CHARGING</div><h1>Charge nearby.<br><em>Move forward.</em></h1><p class="landing-sub">Find trusted community chargers, compare transparent prices, and get back on the road — powered by people around you.</p>
 <div class="landing-actions"><button class="landing-cta" onclick="event.stopPropagation();roleScr()">Get started <span>↗</span></button><div class="secure-note"><span>✓</span> Built for smarter, shared mobility</div></div>
 <div class="landing-stats"><div><b>24/7</b><span>Charging access</span></div><div><b>₹ upfront</b><span>Clear pricing</span></div><div><b>Live</b><span>Nearby discovery</span></div></div></div>
 <div class="visual-panel"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="energy-core"><div class="core-glow"></div><svg viewBox="0 0 120 150" aria-hidden="true"><path d="M68 8 25 79h29l-5 63 48-82H67z" fill="url(#energyGrad)"/><defs><linearGradient id="energyGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5fff4"/><stop offset=".55" stop-color="#45e4d1"/><stop offset="1" stop-color="#8a72ff"/></linearGradient></defs></svg></div>
 <div class="float-card float-top"><span class="float-icon">⌁</span><div><b>Charging, simplified</b><small>Find your next power stop</small></div><span class="float-check">✓</span></div>
 <div class="float-card float-bottom"><span class="pin-icon">⌖</span><div><small>COMMUNITY CHARGER</small><b>Closer than you think.</b><span class="mini-tags"><i>Live location</i><i>Clear rates</i></span></div></div><div class="visual-caption">POWER SHARED IS POWER MULTIPLIED</div></div></div>
 <div class="landing-footer"><span>CHARGESHARE <b>•</b> PEER-TO-PEER EV NETWORK</span><span>Charge local. Drive limitless. <b>↗</b></span></div>
 </section>`,"landing");}
function roleScr(){go(`<div class="scr"><h2>Welcome 👋</h2><p class="mut">Register first. Choose how you’ll use ChargeShare.</p>
<button class="role" onclick="pick('driver')"><span class="e">🚗</span><b>I’m an EV driver</b><span class="mut">Low battery? Find a compatible private charger near your live location.</span></button>
<button class="role" onclick="pick('host')"><span class="e">🏠</span><b>I own a charger</b><span class="mut">Earn money by sharing your idle home charger.</span></button></div>`,"role")}
function pick(r){S.role=r;S.p[r]?app():reg(r)}
function reg(r){const h=r==="host";CC="CCS2";
 go(`<div class="scr"><p class="mut">Step 1 of 2 · Registration</p><h2>${h?"Host registration":"Driver registration"}</h2>
<div class="box" id="gc" style="margin-top:12px">${gchip()}</div>
<label>Full name</label><input id="nm" placeholder="Your name">
<label>Mobile number</label><input id="ph" inputmode="numeric" placeholder="10-digit number">
<label>Vehicle number</label><input id="vn" placeholder="KL07AB1234">
<label>Driving licence number</label><input id="dl" placeholder="KL0720110012345">
<label>${h?"Charger connector type":"Your vehicle’s connector"}</label>
<div class="chips" id="cc">${CONN.map(c=>`<span class="chip ${c===CC?"on":""}" onclick="setC(this,'${c}')">${c}</span>`).join("")}</div>
${h?`<label>Charger power (kW)</label><input id="kw" type="number" value="7.4" step="0.1">
<label>Your rate (₹ per kWh)</label><input id="rt" type="number" value="12">
<label>Charger address (private — shown only after booking)</label><input id="ad" placeholder="House / flat, street">
<p class="mut" style="margin-top:8px">Your charger is pinned at your <b>live location right now</b> — register while standing at the charger.</p>`:`<label>Current battery: <b id="bv">12</b>%</label><input id="bt" type="range" min="1" max="40" value="12" oninput="bv.textContent=this.value">`}
<div class="err" id="er"></div>
<button class="btn" onclick="submitReg('${r}')">Verify &amp; continue</button>
<button class="btn ghost" onclick="demo()">Fill sample details</button></div>`,"reg");startGeo()}
function setC(el,c){CC=c;document.querySelectorAll("#cc .chip").forEach(x=>x.classList.remove("on"));el.classList.add("on")}
function demo(){nm.value="Arun Kumar";ph.value="9876543210";vn.value="KL07AB1234";dl.value="KL0720110012345";if($("#ad"))ad.value="12, Palm Street"}
function submitReg(r){
 const V=vn.value.toUpperCase().replace(/[\s-]/g,""),D=dl.value.toUpperCase().replace(/[\s-]/g,"");
 const chk=[[nm,nm.value.trim().length>2],[ph,/^[6-9]\d{9}$/.test(ph.value)],[vn,V.length>=8],[dl,D.length===15]];
 if(r==="host")chk.push([ad,ad.value.trim().length>3]);
 let bad=0;chk.forEach(([e,ok])=>{e.classList.toggle("bad",!ok);if(!ok)bad++});
 if(bad){er.textContent="Please correct the highlighted fields (mobile: 10 digits, licence: 15 characters).";return}
 const p={name:nm.value.trim().split(" ")[0],phone:ph.value,veh:V,lic:D,conn:CC};
 if(r==="host"){p.kw=+kw.value||7.4;p.rate=+rt.value||12;p.addr=ad.value}else p.batt=+bt.value;
 S.pend=p;verify(r)}
function checkIds(p){const yr=new Date().getFullYear();let m=p.veh.match(/^([A-Z]{2})(\d{2})[A-Z]{1,3}\d{4}$/);
 if(!(/^\d{2}BH\d{4}[A-Z]{2}$/.test(p.veh)||(m&&ST.has(m[1])&&+m[2]>0)))return"Vehicle number isn’t a valid Indian registration (check state code, RTO number and series).";
 m=p.lic.match(/^([A-Z]{2})(\d{2})(\d{4})(\d{7})$/);
 if(!(m&&ST.has(m[1])&&+m[2]>0&&+m[3]>=1950&&+m[3]<=yr))return"Licence number isn’t valid (expected state code, RTO, issue year 1950–"+yr+", 7-digit serial).";return null}
async function dupCheck(p){if(!DBH||!(window.crypto&&crypto.subtle))return null;

 go(`${topbar()}<div style="padding:0 20px"><h2>My bookings</h2>${L.length?L.map(b=>`<div class="box"><b>${b.n}</b> <span class="tag ${b.st==="ok"?"g":"y"}">${b.st==="ok"?"CONFIRMED":"PENDING"}</span><div class="mut">${b.id} · ${b.kwh} kWh · ${new Date(b.ts).toLocaleString()}</div><div class="row"><span>Paid</span><b>${money(b.t)}</b></div>${b.st==="ok"?`<div class="row s"><span>OTP at charger</span><b>${b.otp}</b></div>${b.lat?`<a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" rel="noopener" style="color:var(--ac2)">Navigate →</a>`:""}`:""}</div>`).join(""):`<p class="mut">No bookings yet.</p>`}</div>${tabs()}`,"drvb")}
function profView(){const r=S.role,p=S.p[r];go(`${topbar()}<div style="padding:0 20px;text-align:center"><div class="avatar">${p.name[0]}</div><h2>${p.name}</h2><span class="tag g">✓ REGISTERED ${r.toUpperCase()}</span></div>
 <div class="box" style="margin:16px 20px"><div class="row"><span class="mut">Mobile</span><span>••••••${p.phone.slice(-4)}</span></div><div class="row"><span class="mut">Vehicle</span><span>${p.veh.slice(0,4)}••${p.veh.slice(-2)}</span></div><div class="row"><span class="mut">Licence</span><span>${p.lic.slice(0,4)}•••••••${p.lic.slice(-2)}</span></div><div class="row"><span class="mut">Connector</span><span>${p.conn}${p.kw?" · "+p.kw+" kW":""}</span></div><div class="row"><span class="mut">Format &amp; duplicate check</span><span style="color:var(--g)">Passed</span></div><div class="row"><span class="mut">Govt. RC/DL lookup</span><span class="mut">Not connected</span></div></div>
 <div style="padding:0 20px"><button class="btn ghost" onclick="S.p['${r}']=null;roleScr()">Sign out</button></div>${tabs()}`,"prof")}
/* ---------- admin ---------- */
async function adminLogin(){go(`<div class="scr big"><div class="sp" style="margin:60px auto 14px;width:40px;height:40px"></div><b>Checking admin access…</b></div>`,"adl");
 let ok=false;try{const u=await claude.use("user");ok=!!u&&(await u.isOwner()||await u.canEdit())&&!!DBH}catch(e){}
 if(!ok)return go(`<div class="scr"><div class="big"><div class="ok" style="background:var(--r)">✕</div><h2>Admin access denied</h2><p class="mut">Admin sign-in is tied to the platform owner’s claude.ai account (not a password in the page). Sign in with the owner account on the hosted link to continue.</p></div><button class="btn ghost" onclick="roleScr()">← Back</button></div>`,"adl");
 try{const s=await DBH.doc("data/users/"+U+"/admin").get();if(s.exists){S.adm=s.data();return startAdmin()}}catch(e){}
 go(`<div class="scr"><p class="mut">Admin setup · one time</p><h2>Platform owner details</h2><p class="mut">Your commission earnings are credited to this account.</p><label>Full name</label><input id="an" placeholder="Admin name"><label>Business / company name</label><input id="ab" placeholder="ChargeShare Pvt Ltd"><label>Mobile</label><input id="am" inputmode="numeric" placeholder="10-digit number"><label>Email</label><input id="ae" type="email" placeholder="you@company.com"><label>UPI ID for commission payouts</label><input id="au" placeholder="name@bank"><div class="err" id="er"></div><button class="btn" onclick="admSave()">Create admin account</button></div>`,"adr")}
async function admSave(){const d={name:an.value.trim(),biz:ab.value.trim(),mob:am.value.trim(),mail:ae.value.trim(),upi:au.value.trim()};
 if(d.name.length<3||d.biz.length<2||!/^[6-9]\d{9}$/.test(d.mob)||!/^\S+@\S+\.\S+$/.test(d.mail)||!/^[\w.\-]{2,}@[\w]{2,}$/.test(d.upi)){er.textContent="Please fill every field correctly (mobile: 10 digits, UPI like name@bank).";return}
 try{await DBH.doc("data/users/"+U+"/admin").set(d);S.adm=d;startAdmin()}catch(e){er.textContent="Couldn’t save: "+(e.message||e)}}
function startAdmin(){S.role="admin";S.tab="ov";if(!S.admSub){S.admSub=1;DBH.collection("bookings").onSnapshot(s=>{S.bA=s.docs.map(d=>({...d.data(),did:d.id}));refresh()})}adminView()}
function adminView(){const A=S.adm,B=[...S.bA].sort((a,b)=>b.ts-a.ts),ok=B.filter(b=>b.st==="ok"),earn=ok.reduce((a,b)=>a+b.cm,0),pend=B.filter(b=>b.st==="p").reduce((a,b)=>a+b.cm,0),gmv=ok.reduce((a,b)=>a+b.t,0),live=S.ch.filter(c=>c.on!==false).length;let h="";
 if(S.tab==="ov")h=`<p class="mut">Welcome back, ${A.name} · ${A.biz}</p><div class="hero"><span>Commission earned</span><b>${money(earn)}</b><small>${S.rate}% of every accepted booking · ${money(pend)} pending</small></div>
 <div class="stat" style="margin-top:12px"><div><b>${money(gmv)}</b><span class="mut">GMV</span></div><div><b>${ok.length}</b><span class="mut">completed</span></div><div><b>${live}</b><span class="mut">live hosts</span></div></div>
 <h3 style="margin:20px 0 6px">Recent commission</h3>${ok.slice(0,5).map(b=>`<div class="row"><span>${b.n}<br><small class="mut">${b.id}</small></span><b style="color:var(--g)">+${money(b.cm)}</b></div>`).join("")||`<p class="mut">No accepted bookings yet.</p>`}`;
 if(S.tab==="bks")h=`<h2>All bookings</h2>${B.map(b=>`<div class="box"><b>${b.n}</b> <span class="tag ${b.st==="ok"?"g":"y"}">${b.st==="ok"?"ACCEPTED":"PENDING"}</span><div class="mut">${b.driverName} · ${b.id} · ${b.kwh} kWh${b.pm?" · "+b.pm:""}</div><div class="row"><span>Driver paid</span><span>${money(b.t)}</span></div><div class="row s"><span>Host payout</span><span>${money(b.pf)}</span></div><div class="row"><span>Your commission</span><b style="color:var(--g)">${money(b.cm)}</b></div></div>`).join("")||`<p class="mut">No bookings yet.</p>`}`;
 if(S.tab==="hosts")h=`<h2>Hosts (${S.ch.length})</h2>${S.ch.map(c=>`<div class="box" style="display:flex;justify-content:space-between;align-items:center"><div><b>${c.name}</b><div class="mut">${c.conn} · ${c.kw} kW · ₹${c.rate}/kWh</div></div><div class="sw ${c.on!==false?"on":""}" onclick="admTog('${c.id}',${c.on===false})"><i></i></div></div>`).join("")||`<p class="mut">No hosts registered yet.</p>`}<p class="mut">Toggle to suspend or reinstate a host.</p>`;
 if(S.tab==="set")h=`<h2>Settings</h2><div class="box"><label style="margin-top:0">Commission rate (%)</label><input id="rt2" type="number" min="1" max="30" value="${S.rate}"><button class="btn" onclick="setRate()">Save commission rate</button></div>
 <div class="box"><div class="row"><span class="mut">Admin</span><span>${A.name}</span></div><div class="row"><span class="mut">Business</span><span>${A.biz}</span></div><div class="row"><span class="mut">Email</span><span>${A.mail}</span></div><div class="row"><span class="mut">Payout UPI</span><span>${A.upi.slice(0,2)}•••${A.upi.slice(A.upi.indexOf("@"))}</span></div></div>
 <button class="btn" onclick="toast('Simulated payout of ${money(earn)} sent to your UPI')">Withdraw ${money(earn)} to UPI</button><p class="mut" style="margin-top:8px">Payouts are simulated in this prototype.</p>`;
 go(`${topbar()}<div style="padding:0 20px">${h}</div>${tabs()}`,"adm")}
async function admTog(id,v){try{await DBH.collection("chargers").doc(id).update({on:v})}catch(e){toast("Couldn’t update host")}}
async function setRate(){const v=+rt2.value;if(!(v>=1&&v<=30))return toast("Enter 1–30%");try{await DBH.doc("config/platform").set({rate:v});toast("Commission set to "+v+"%")}catch(e){toast("Couldn’t save")}}

/* ---------- payments (simulated gateway) + map tiles ---------- */
const PM=[["UPI apps",[["Google Pay","#4285f4"],["PhonePe","#5f259f"],["Paytm","#00baf2"],["BHIM","#f58220"],["Amazon Pay","#ff9900"],["Other UPI ID","#334155"]]],["Net banking",[["SBI","#22409a"],["HDFC Bank","#004c8f"],["ICICI Bank","#f37e20"],["Axis Bank","#97144d"],["Kotak","#ed1c24"],["Other banks","#475569"]]],["Cards &amp; wallets",[["Debit / Credit card","#6b7280"],["Paytm Wallet","#00baf2"],["Mobikwik","#2b6df6"]]]];
function payMethods(){const f=fare(S.sel,S.kwh);S.pm=null;
 $(".sh").innerHTML=`<h2>Choose payment method</h2><p class="mut">Pay ${money(f.t)} · held in escrow until charging ends</p>${PM.map(([t,a])=>`<label>${t}</label><div class="pmg">${a.map(([n,col])=>`<div class="pm" data-n="${n}" onclick="selPm(this)"><i style="background:${col}">${n[0]}</i><span>${n}</span></div>`).join("")}</div>`).join("")}<div id="upiBox" style="display:none"><label>Your UPI ID</label><input id="upi" placeholder="name@okaxis"></div><div class="err" id="pe"></div><button class="btn" id="pb" disabled onclick="payConfirm()">Select a method</button><button class="btn ghost" onclick="this.closest('.sheet').remove();paintDrv()">Cancel</button>`}
function selPm(el){document.querySelectorAll(".pm").forEach(x=>x.classList.remove("on"));el.classList.add("on");S.pm=el.dataset.n;$("#upiBox").style.display=S.pm==="Other UPI ID"?"block":"none";const b=$("#pb");b.disabled=false;b.innerHTML="Pay "+money(fare(S.sel,S.kwh).t)+" with "+S.pm}
function payConfirm(){if(S.pm==="Other UPI ID"){if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(upi.value.trim())){pe.textContent="Enter a valid UPI ID, e.g. name@okaxis";return}return payGo("UPI · "+upi.value.trim())}payGo(S.pm)}
function tiles(rg){const me=S.pos;if(!me)return"";const u=112/(rg*1000),la=rad(me.lat),M=40075016.686*Math.cos(la)*u;
 const z=Math.max(3,Math.min(17,Math.round(Math.log2(M/90)))),n=2**z,T=M/n,x=(me.lng+180)/360*n,y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n,k=Math.min(4,Math.ceil(180/T)+1);let o="";
 for(let i=Math.floor(x)-k;i<=Math.floor(x)+k;i++)for(let j=Math.floor(y)-k;j<=Math.floor(y)+k;j++)o+=`<image href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${j}/${i}" x="${(180+(i-x)*T).toFixed(1)}" y="${(130+(j-y)*T).toFixed(1)}" width="${(T+.6).toFixed(1)}" height="${(T+.6).toFixed(1)}"/>`;
 return o+`<text x="4" y="256" font-size="8" fill="#555">Tiles © Esri — HERE, Garmin, OpenStreetMap contributors</text>`}

/* ---------- shared network (db) ---------- */
(async()=>{try{if(typeof claude==="undefined")return;DBH=await claude.use("db");const u=await claude.use("user");U=u?await u.id():null;
 if(!U)U="u"+Math.random().toString(36).slice(2,10);if(!DBH)return;
 DBH.doc("config/platform").onSnapshot(x=>{if(x.exists)S.rate=+x.data().rate||10;refresh()});DBH.collection("chargers").onSnapshot(s=>{S.ch=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
 const m=s=>s.docs.map(d=>({...d.data(),did:d.id}));
 DBH.collection("bookings").where("driverUid","==",U).onSnapshot(s=>{S.bD=m(s);refresh()});
 DBH.collection("bookings").where("hostUid","==",U).onSnapshot(s=>{S.bH=m(s);refresh()})}catch(e){}U=U||"u"+Math.random().toString(36).slice(2,10)})();
intro();
